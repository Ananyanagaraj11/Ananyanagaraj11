<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="280" viewBox="0 0 1200 280" role="img" aria-label="Ananya Naga Raj profile banner">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#312e81"/>
      <animate attributeName="x1" values="0%;100%;0%" dur="12s" repeatCount="indefinite"/>
    </linearGradient>
    <linearGradient id="nameGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#a5b4fc"/>
      <stop offset="50%" stop-color="#f0abfc"/>
      <stop offset="100%" stop-color="#67e8f9"/>
      <animate attributeName="x1" values="0%;100%;0%" dur="5s" repeatCount="indefinite"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#6366f1" stroke-width="0.5" opacity="0.15"/>
    </pattern>
  </defs>

  <rect width="1200" height="280" fill="url(#bg)" rx="18"/>
  <rect width="1200" height="280" fill="url(#grid)" rx="18" opacity="0.6">
    <animate attributeName="opacity" values="0.35;0.7;0.35" dur="4s" repeatCount="indefinite"/>
  </rect>

  <!-- floating particles -->
  <circle cx="120" cy="60" r="3" fill="#818cf8" opacity="0.8">
    <animate attributeName="cy" values="60;40;60" dur="3s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.4;1;0.4" dur="3s" repeatCount="indefinite"/>
  </circle>
  <circle cx="980" cy="90" r="4" fill="#22d3ee" opacity="0.7">
    <animate attributeName="cx" values="980;1010;980" dur="5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="760" cy="210" r="2.5" fill="#c4b5fd" opacity="0.9">
    <animate attributeName="cy" values="210;190;210" dur="4s" repeatCount="indefinite"/>
  </circle>
  <circle cx="420" cy="220" r="2" fill="#67e8f9" opacity="0.6">
    <animate attributeName="cx" values="420;450;420" dur="6s" repeatCount="indefinite"/>
  </circle>

  <!-- scanner line -->
  <rect x="0" y="0" width="1200" height="4" fill="#6366f1" opacity="0.35">
    <animate attributeName="y" values="-4;280;-4" dur="7s" repeatCount="indefinite"/>
  </rect>

  <!-- hologram frame -->
  <rect x="48" y="48" width="1104" height="184" rx="14" fill="none" stroke="#818cf8" stroke-width="1.5" opacity="0.35">
    <animate attributeName="opacity" values="0.2;0.55;0.2" dur="3s" repeatCount="indefinite"/>
  </rect>

  <text x="600" y="118" text-anchor="middle" fill="url(#nameGrad)" font-family="Segoe UI, Arial, sans-serif" font-size="52" font-weight="700" filter="url(#glow)">Ananya Naga Raj</text>
  <text x="600" y="158" text-anchor="middle" fill="#cbd5e1" font-family="Segoe UI, Arial, sans-serif" font-size="18" letter-spacing="2">AI ENGINEER · BACKEND · ML · DISTRIBUTED SYSTEMS</text>
  <text x="600" y="192" text-anchor="middle" fill="#94a3b8" font-family="Segoe UI, Arial, sans-serif" font-size="15">MS Computer Science @ Syracuse University · Python · FastAPI · PyTorch · LLMs · RAG</text>

  <!-- typing dots -->
  <circle cx="572" cy="218" r="5" fill="#6366f1">
    <animate attributeName="opacity" values="0.2;1;0.2" dur="1.2s" begin="0s" repeatCount="indefinite"/>
  </circle>
  <circle cx="600" cy="218" r="5" fill="#8b5cf6">
    <animate attributeName="opacity" values="0.2;1;0.2" dur="1.2s" begin="0.2s" repeatCount="indefinite"/>
  </circle>
  <circle cx="628" cy="218" r="5" fill="#22d3ee">
    <animate attributeName="opacity" values="0.2;1;0.2" dur="1.2s" begin="0.4s" repeatCount="indefinite"/>
  </circle>
</svg>
