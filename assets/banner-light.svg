<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="280" viewBox="0 0 1200 280" role="img" aria-label="Ananya Naga Raj profile banner light">
  <defs>
    <linearGradient id="bgL" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="50%" stop-color="#eef2ff"/>
      <stop offset="100%" stop-color="#e0e7ff"/>
    </linearGradient>
    <linearGradient id="nameGradL" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4338ca"/>
      <stop offset="50%" stop-color="#7c3aed"/>
      <stop offset="100%" stop-color="#0891b2"/>
      <animate attributeName="x1" values="0%;100%;0%" dur="5s" repeatCount="indefinite"/>
    </linearGradient>
    <pattern id="gridL" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#6366f1" stroke-width="0.5" opacity="0.12"/>
    </pattern>
  </defs>
  <rect width="1200" height="280" fill="url(#bgL)" rx="18"/>
  <rect width="1200" height="280" fill="url(#gridL)" rx="18"/>
  <rect x="0" y="0" width="1200" height="3" fill="#6366f1" opacity="0.25">
    <animate attributeName="y" values="-3;280;-3" dur="7s" repeatCount="indefinite"/>
  </rect>
  <circle cx="150" cy="70" r="3" fill="#6366f1" opacity="0.5">
    <animate attributeName="cy" values="70;50;70" dur="3s" repeatCount="indefinite"/>
  </circle>
  <circle cx="1020" cy="100" r="3" fill="#0891b2" opacity="0.5">
    <animate attributeName="cx" values="1020;1050;1020" dur="5s" repeatCount="indefinite"/>
  </circle>
  <text x="600" y="118" text-anchor="middle" fill="url(#nameGradL)" font-family="Segoe UI, Arial, sans-serif" font-size="52" font-weight="700">Ananya Naga Raj</text>
  <text x="600" y="158" text-anchor="middle" fill="#334155" font-family="Segoe UI, Arial, sans-serif" font-size="18" letter-spacing="2">AI ENGINEER · BACKEND · ML · DISTRIBUTED SYSTEMS</text>
  <text x="600" y="192" text-anchor="middle" fill="#64748b" font-family="Segoe UI, Arial, sans-serif" font-size="15">MS Computer Science @ Syracuse University · Python · FastAPI · PyTorch · LLMs · RAG</text>
</svg>
