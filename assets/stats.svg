<svg xmlns="http://www.w3.org/2000/svg" width="520" height="200" viewBox="0 0 520 200" role="img" aria-label="GitHub profile statistics">
<defs>
  <linearGradient id="card" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#1e1b4b"/>
    <stop offset="100%" stop-color="#0f172a"/>
  </linearGradient>
  <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0%" stop-color="#6366f1"/>
    <stop offset="100%" stop-color="#8b5cf6"/>
  </linearGradient>
</defs>

<rect width="520" height="200" rx="16" fill="url(#card)" stroke="#334155" stroke-width="1"/>
<text x="24" y="36" fill="#e2e8f0" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="700">GitHub Stats</text>
<text x="24" y="58" fill="#94a3b8" font-family="Segoe UI, Arial, sans-serif" font-size="12">@Ananyanagaraj11 · generated locally</text>
<text x="40" y="110" fill="#cbd5e1" font-family="Segoe UI, Arial, sans-serif" font-size="14">Public Repos</text>
<text x="40" y="140" fill="#f8fafc" font-family="Segoe UI, Arial, sans-serif" font-size="28" font-weight="700">29</text>
<text x="210" y="110" fill="#cbd5e1" font-family="Segoe UI, Arial, sans-serif" font-size="14">Total Stars</text>
<text x="210" y="140" fill="#f8fafc" font-family="Segoe UI, Arial, sans-serif" font-size="28" font-weight="700">1</text>
<text x="380" y="110" fill="#cbd5e1" font-family="Segoe UI, Arial, sans-serif" font-size="14">Top Language</text>
<text x="380" y="140" fill="#f8fafc" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="700">Python</text>
<rect x="24" y="168" width="472" height="6" rx="3" fill="#1e293b"/>
<rect x="24" y="168" width="236" height="6" rx="3" fill="url(#accent)">
<animate attributeName="width" values="40;460;40" dur="6s" repeatCount="indefinite"/>
</rect>
</svg>